<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Rock|Paper|Scissors</title>
</head>
<body>
    <div id="the-whole-thing">
        <div id="title">Rock Paper Scissors</div>
        <div id="one-v-one">
        <div id="human-score">Your score is:</div>
        <div id="choices">
            <div id="you-chose">
                <p>You chose:</p>
            </div>
            <div id="computer-chose">
                <p>computer chose:</p>
            </div>
        </div>
        <div id="computer-score">computer's score is:</div>
        </div>
        <div id="round-no">Round: </div>
        <p id="round-result"></p>
        <div id="buttons">
            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissors">Scissors</button>
        </div>
        <div id="result"></div>
    </div>
</body>
</html>
